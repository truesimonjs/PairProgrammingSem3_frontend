<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
     <!-- Import Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div id="app">
      <app-navbar
        :authenticated="authenticated"
        @authenticated-change="authenticated = $event"
      ></app-navbar>
      <record-list :authenticated="authenticated"></record-list>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/components/delete.js"></script>
    <script src="./js/components/getall.js"></script>
    <script src="./js/components/filter.js"></script>
    <script src="./js/components/navbar.js"></script>
    <script src="./js/components/create.js"></script>
    <script>
      app.mount("#app");
    </script>
  </body>
</html>
