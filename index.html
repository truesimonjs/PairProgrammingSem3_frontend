<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
     <!-- Import Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div id="app">
      <nav class="navbar navbar-dark bg-dark">
        <span class="navbar-brand mb-0 h1">Music Records</span>
      </nav>

      <main class="container py-4">
        <h2 class="mb-3">Your collection</h2>
        <ul class="list-group">
          <li
            v-for="record in musicRecords"
            :key="record.id"
            class="list-group-item"
          >
            <strong>{{ record.title }}</strong>
            <span class="text-muted">by {{ record.artist }}</span>
            <button class="btn btn-outline-danger btn-sm float-right" @click="deleteMusicRecord(record.id)">Delete</button>
          </li>
        </ul>
        published 
        <form class="card card-body mt-4" @submit.prevent="addMusicRecord()">
          <h3 class="h5 mb-3">Add a record</h3>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="record-title">Title</label>
              <input id="record-title" class="form-control" required type="text" v-model="title" placeholder="Enter title" />
            </div>
            <div class="form-group col-md-6">
              <label for="record-artist">Artist</label>
              <input id="record-artist" class="form-control" required type="text" v-model="artist" placeholder="Enter artist" />
            </div>
            <div class="form-group col-md-6">
              <label for="record-duration">Duration</label>
              <input id="record-duration" class="form-control" required type="number" v-model="duration" placeholder="Duration in minutes" />
            </div>
            <div class="form-group col-md-6">
              <label for="record-publication-year">Publication year</label>
              <input id="record-publication-year" class="form-control" required type="number" v-model="publicationYear" placeholder="Year released" />
            </div>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">Add Record</button>
          </div>
        </form>
      </main>
    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
